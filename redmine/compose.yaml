services:
  redmine-db:
    image: docker.io/bitnami/mariadb:11.4
    profiles: [redmine]
    restart: unless-stopped
    ports:
      - '3306:3306'
    volumes:
      - type: volume
        source: 'mariadb_data'
        target: '/bitnami/mariadb'
    environment:
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      - ALLOW_EMPTY_PASSWORD=yes
      - MARIADB_USER=bn_redmine
      - MARIADB_DATABASE=bitnami_redmine
  redmine:
    image: docker.io/bitnami/redmine:5
    profiles: [redmine]
    restart: unless-stopped
    ports:
      - '80:3000'
    volumes:
      - type: volume
        source: 'redmine_data'
        target: '/bitnami/redmine'
      - type: bind
        source: './themes/PurpleMine2'
        target: '/opt/bitnami/redmine/public/themes/PurpleMine2'
    depends_on:
      - redmine-db
    environment:
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      - ALLOW_EMPTY_PASSWORD=yes
      - REDMINE_DATABASE_HOST=redmine-db
      - REDMINE_DATABASE_PORT_NUMBER=3306
      - REDMINE_DATABASE_USER=bn_redmine
      - REDMINE_DATABASE_NAME=bitnami_redmine
volumes:
  mariadb_data:
    driver: local
  redmine_data:
    driver: local
