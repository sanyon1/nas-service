services:
  jellyfin:
    extends:
      file: ../compose-common/hardening.yaml
      service: hardened
    image: jellyfin/jellyfin:12.2
    profiles: [jellyfin]
    group_add:
      - "993"   # host render group, for /dev/dri/renderD128
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    # LAN clients (TV/mobile apps) until a trusted certificate is in place; revisit once one is issued.
    ports:
      - "8096:8096"
    volumes:
      - /srv/appdata/jellyfin/config:/config
      - /srv/appdata/jellyfin/cache:/cache
      - /mnt/hdd0/share/media:/media:ro
    networks:
      - jellyfin_edge
      - jellyfin_proxy

networks:
  jellyfin_edge:
