# Networks shared across service folders. Per-service edge networks are defined in each service's own file.
networks:
  # Each backend shares an internal network with Caddy only, so backends cannot reach each other.
  # Fixed subnets so a backend can trust exactly this range for X-Forwarded-For.
  jellyfin_proxy:
    name: jellyfin_proxy
    internal: true
    ipam:
      config:
        - subnet: 10.20.2.0/24
