services:
  sftpgo:
    extends:
      file: ../compose-common/hardening.yaml
      service: hardened
    image: drakkan/sftpgo:v2.7.6
    profiles: [sftpgo]
    # Settings via environment (docs.sftpgo.com/2.7/env-vars): SFTPGO_<SECTION>__<KEY>, array index as a segment.
    environment:
      # Binding 0: web client only, reached through Caddy on sftpgo_proxy. Not published.
      SFTPGO_HTTPD__BINDINGS__0__PORT: "8080"
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_ADMIN: "false"
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_WEB_CLIENT: "true"
      SFTPGO_HTTPD__BINDINGS__0__ENABLE_REST_API: "false"
      SFTPGO_HTTPD__BINDINGS__0__PROXY_ALLOWED: "10.20.1.0/24"
      SFTPGO_HTTPD__BINDINGS__0__CLIENT_IP_PROXY_HEADER: "X-Forwarded-For"
      # Binding 1: admin UI and REST API, published to the LAN only.
      SFTPGO_HTTPD__BINDINGS__1__PORT: "8081"
      SFTPGO_HTTPD__BINDINGS__1__ENABLE_WEB_ADMIN: "true"
      SFTPGO_HTTPD__BINDINGS__1__ENABLE_WEB_CLIENT: "false"
      SFTPGO_HTTPD__BINDINGS__1__ENABLE_REST_API: "true"
      SFTPGO_DATA_PROVIDER__BACKUPS_PATH: "/var/lib/sftpgo/backups"
      # FTP and WebDAV stay disabled (port 0 is the image default; pinned here on purpose).
      SFTPGO_FTPD__BINDINGS__0__PORT: "0"
      SFTPGO_WEBDAVD__BINDINGS__0__PORT: "0"
      SFTPGO_SFTPD__BINDINGS__0__PORT: "2022"
      SFTPGO_COMMON__DEFENDER__ENABLED: "true"
      SFTPGO_COMMON__UMASK: "002"
    # Published ports are LAN-only via DOCKER-USER (startup/docker-user-lan.sh).
    ports:
      - "2022:2022"   # SFTP
      - "8081:8081"   # admin UI
    volumes:
      # Config dir: SQLite DB, SSH host keys, backups.
      - /srv/appdata/sftpgo/state:/var/lib/sftpgo
      - /mnt/hdd0/share:/srv/sftpgo/share
    networks:
      - sftpgo_edge
      - sftpgo_proxy

networks:
  sftpgo_edge:
