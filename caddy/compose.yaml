services:
  caddy:
    extends:
      file: ../compose-common/hardening.yaml
      service: hardened
    image: caddy:2.11.7
    profiles: [caddy]
    # Only port open to the internet. Caddy listens on 8443 inside (https_port 8443) so it needs no capability.
    ports:
      - "443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/appdata/caddy/data:/data
      - /srv/appdata/caddy/config:/config
    networks:
      - caddy_edge
      - sftpgo_proxy
      - jellyfin_proxy

networks:
  caddy_edge:
